# Prefix: Ctrl+Space (instead of default Ctrl+b)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Behaviour ---
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"   # truecolor passthrough
set -g history-limit 50000           # default 2000 is far too small
set -s escape-time 10                # no delay after Esc (vim users)
set -g focus-events on               # let editors see focus gained/lost
set -g display-time 2000

# Number windows/panes from 1 (matches keyboard order), close gaps on delete
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload this file
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- Splits: | and _, opening in the current pane's directory ---
unbind '"'
unbind '%'
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Pane navigation: vim-style (prefix + h/j/k/l) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Window switching without prefix ---
bind -n M-Left  previous-window
bind -n M-Right next-window

# --- Copy mode: vim keys (v to select, y to yank) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Status bar ---
set -g status-bg colour8
set -g window-status-current-format "#[fg=colour8]#[bg=colour4]#[fg=colour7]#[bg=colour4] #I* #[fg=colour7] #W #[fg=colour4]#[bg=colour8]"
set -g window-status-format "#[fg=colour232]#[bg=colour8]#I.#[fg=colour232]  #W"
